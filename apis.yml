name: Own Up
description: >-
  Own Up is an AI-driven mortgage marketplace that helps borrowers shop for home
  loans by comparing personalized rate offers from a network of top-rated lenders
  without hard credit checks or sales pressure. It provides real-time rate
  comparisons, personalized recommendations, pre-approval letters, and educational
  resources for both home purchases and refinancing. Own Up is not a lender or bank;
  it arranges loans and is compensated by third-party lenders whose offers appear on
  the platform. Surfaced as a Techstars portfolio company and profiled in the API
  Evangelist network; the company publishes no public developer API, SDKs, or
  developer portal at this time.
